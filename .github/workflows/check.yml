name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Unit tests
        run: |
          npm ci
          npm test
      - name: Container checks
        # Builds the image the way Dockhold builds a repo with no Dockerfile,
        # then runs it as user 1001 with every capability dropped and a fixed
        # PORT. Covers the missing token, a refused token, tokens in logs and
        # on the command line, and SIGTERM.
        run: tests/smoke.sh
